name: Update media mentions

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-mentions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test feed handling
        run: python3 -m unittest discover -s tests -v

      - name: Fetch mentions from Google Alerts
        env:
          GOOGLE_ALERTS_RSS_URL: ${{ secrets.GOOGLE_ALERTS_RSS_URL }}
        run: python3 scripts/fetch_mentions.py

      - name: Commit updated mentions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/mentions.json
          if ! git diff --cached --quiet -- data/mentions.json; then
            git commit -m "chore: update media mentions"
            git push
          else
            echo "No changes to media mentions."
          fi
